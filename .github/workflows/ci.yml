# CI — chạy cho mọi push / PR vào main. Render deploy tự động SAU khi các check này pass
# (render.yaml: autoDeployTrigger: checksPass) → commit lỗi build / test không lên production.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/laclingo/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/laclingo/backend/go.mod
          cache-dependency-path: apps/laclingo/backend/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /dev/null ./cmd/server

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/laclingo/web
    env:
      # Chỉ để build kiểm tra — bản deploy lấy giá trị thật từ Render
      NEXT_PUBLIC_API_URL: https://laclingo-platform.onrender.com/api/v1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/laclingo/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  trading-web:
    name: Trading web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/trading/web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/trading/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
