basePath: /api/v1
definitions:
  domain.VocabularyReviewRequest:
    properties:
      quality:
        description: 0 -> 5
        example: 4
        maximum: 5
        minimum: 0
        type: integer
      user_id:
        example: 11111111-1111-1111-1111-111111111111
        format: uuid
        type: string
      vocabulary_id:
        example: 22222222-2222-2222-2222-222222222222
        format: uuid
        type: string
    type: object
  domain.VocabularyReviewResponse:
    properties:
      interval_days:
        example: 1
        type: integer
      new_stage:
        example: 1
        type: integer
      next_review_at:
        type: string
      vocabulary_id:
        format: uuid
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: không tìm thấy dữ liệu
        type: string
    type: object
  service.DueVocabulary:
    properties:
      audio_url:
        type: string
      meaning:
        type: string
      next_review_at:
        type: string
      phonetic:
        type: string
      srs_stage:
        type: integer
      term:
        example: apple
        type: string
      vocabulary_id:
        format: uuid
        type: string
    type: object
  service.LanguageResponse:
    properties:
      code:
        example: en-US
        type: string
      created_at:
        type: string
      id:
        example: en
        type: string
      name:
        example: English
        type: string
    type: object
  service.UserResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        example: user@laclingo.vn
        type: string
      full_name:
        type: string
      id:
        format: uuid
        type: string
      streak_count:
        type: integer
    type: object
info:
  contact: {}
  description: API học ngôn ngữ với thuật toán SRS (SM-2).
  title: LacLingo API
  version: "1.0"
paths:
  /languages:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.LanguageResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Danh sách ngôn ngữ
      tags:
      - languages
  /languages/{id}:
    get:
      parameters:
      - description: Language ID
        example: en
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.LanguageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Lấy thông tin ngôn ngữ
      tags:
      - languages
  /srs/due:
    get:
      parameters:
      - description: User ID (UUID)
        format: uuid
        in: query
        name: user_id
        required: true
        type: string
      - description: Số lượng tối đa (mặc định 20, tối đa 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.DueVocabulary'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Từ vựng đến hạn ôn tập
      tags:
      - srs
  /srs/reviews:
    post:
      consumes:
      - application/json
      parameters:
      - description: Kết quả ôn tập
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.VocabularyReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.VocabularyReviewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Ghi nhận kết quả ôn tập (SM-2)
      tags:
      - srs
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.UserResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Danh sách user
      tags:
      - users
  /users/{id}:
    get:
      parameters:
      - description: User ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Lấy thông tin user
      tags:
      - users
swagger: "2.0"
