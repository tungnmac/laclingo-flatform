basePath: /api/v1
definitions:
  domain.CreateRoomRequest:
    properties:
      difficulty:
        example: 2
        maximum: 5
        minimum: 1
        type: integer
      is_practice:
        example: false
        type: boolean
      language_id:
        example: en
        type: string
      question_count:
        example: 10
        maximum: 50
        minimum: 1
        type: integer
      time_per_question_seconds:
        example: 20
        maximum: 120
        minimum: 5
        type: integer
    type: object
  domain.CreateRoomResponse:
    properties:
      code:
        example: AB3K9Z
        type: string
      difficulty:
        type: integer
      id:
        format: uuid
        type: string
      is_practice:
        type: boolean
      max_participants:
        type: integer
      question_count:
        type: integer
      status:
        example: waiting
        type: string
      time_per_question_seconds:
        type: integer
    type: object
  domain.InviteRequest:
    properties:
      username:
        example: nguyenvana
        type: string
    type: object
  domain.JoinRoomRequest:
    properties:
      code:
        example: AB3K9Z
        type: string
    type: object
  domain.LeaderboardEntryResponse:
    properties:
      avatar_url:
        type: string
      full_name:
        type: string
      rank:
        type: integer
      score:
        type: integer
      user_id:
        format: uuid
        type: string
      username:
        type: string
    type: object
  domain.LearnVocabularyRequest:
    properties:
      vocabulary_id:
        example: 22222222-2222-2222-2222-222222222222
        format: uuid
        type: string
    type: object
  domain.LearnVocabularyResponse:
    properties:
      learned:
        example: true
        type: boolean
      vocabulary_id:
        format: uuid
        type: string
    type: object
  domain.ParticipantResponse:
    properties:
      avatar_url:
        type: string
      full_name:
        type: string
      joined_at:
        type: string
      room_id:
        format: uuid
        type: string
      score:
        type: integer
      user_id:
        format: uuid
        type: string
      username:
        type: string
    type: object
  domain.RoomDetailResponse:
    properties:
      code:
        type: string
      difficulty:
        type: integer
      host_user_id:
        format: uuid
        type: string
      id:
        format: uuid
        type: string
      is_practice:
        type: boolean
      participants:
        items:
          $ref: '#/definitions/domain.ParticipantResponse'
        type: array
      question_count:
        type: integer
      status:
        type: string
      time_per_question_seconds:
        type: integer
    type: object
  domain.VocabularyReviewRequest:
    properties:
      quality:
        description: 0 -> 5
        example: 4
        maximum: 5
        minimum: 0
        type: integer
      vocabulary_id:
        example: 22222222-2222-2222-2222-222222222222
        format: uuid
        type: string
    type: object
  domain.VocabularyReviewResponse:
    properties:
      interval_days:
        example: 1
        type: integer
      new_stage:
        example: 1
        type: integer
      next_review_at:
        type: string
      vocabulary_id:
        format: uuid
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: không tìm thấy dữ liệu
        type: string
    type: object
  handler.submitExerciseRequest:
    properties:
      answer:
        example: goes
        type: string
    type: object
  service.AuthResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/service.UserResponse'
    type: object
  service.DueVocabulary:
    properties:
      audio_url:
        type: string
      language_id:
        example: en
        type: string
      meaning:
        type: string
      next_review_at:
        type: string
      phonetic:
        type: string
      srs_stage:
        type: integer
      term:
        example: apple
        type: string
      vocabulary_id:
        format: uuid
        type: string
    type: object
  service.FavoriteResponse:
    properties:
      favorited:
        type: boolean
      vocabulary_id:
        format: uuid
        type: string
    type: object
  service.GrammarExerciseResponse:
    properties:
      correct_answer:
        example: goes
        type: string
      explanation:
        type: string
      id:
        format: uuid
        type: string
      options:
        items:
          type: string
        type: array
      order_index:
        type: integer
      question:
        example: She _______ to school every day.
        type: string
      type:
        example: MULTIPLE_CHOICE
        type: string
    type: object
  service.GrammarLessonDetail:
    properties:
      code:
        example: present_simple
        type: string
      content:
        type: object
      exercises:
        items:
          $ref: '#/definitions/service.GrammarExerciseResponse'
        type: array
      id:
        format: uuid
        type: string
      level:
        example: A1
        type: string
      title:
        example: Thì Hiện Tại Đơn (Present Simple)
        type: string
    type: object
  service.GrammarLessonSummary:
    properties:
      code:
        example: present_simple
        type: string
      id:
        format: uuid
        type: string
      level:
        example: A1
        type: string
      order_index:
        type: integer
      title:
        example: Thì Hiện Tại Đơn (Present Simple)
        type: string
    type: object
  service.GrammarTopicResponse:
    properties:
      code:
        example: english_12_tenses
        type: string
      description:
        type: string
      id:
        format: uuid
        type: string
      lessons:
        items:
          $ref: '#/definitions/service.GrammarLessonSummary'
        type: array
      order_index:
        type: integer
      title:
        example: 12 Thì Trong Tiếng Anh
        type: string
    type: object
  service.LanguageResponse:
    properties:
      code:
        example: en-US
        type: string
      created_at:
        type: string
      id:
        example: en
        type: string
      name:
        example: English
        type: string
    type: object
  service.LeaderboardEntry:
    properties:
      avatar_url:
        type: string
      exp:
        type: integer
      full_name:
        type: string
      level:
        type: integer
      points:
        type: integer
      rank:
        type: integer
      streak_count:
        type: integer
      user_id:
        format: uuid
        type: string
      username:
        type: string
    type: object
  service.LikeResponse:
    properties:
      like_count:
        type: integer
      liked:
        type: boolean
      vocabulary_id:
        format: uuid
        type: string
    type: object
  service.LoginRequest:
    properties:
      identifier:
        example: user@laclingo.vn
        type: string
      password:
        example: matkhau123
        type: string
    type: object
  service.MissionRequest:
    properties:
      action_type:
        enum:
        - srs_review
        - learn_word
        - grammar_exercise
        - challenge_participate
        - challenge_win
        example: srs_review
        type: string
      description:
        type: string
      ends_at:
        type: string
      is_active:
        type: boolean
      period:
        enum:
        - daily
        - weekly
        - monthly
        - event
        example: daily
        type: string
      reward_exp:
        example: 50
        minimum: 0
        type: integer
      reward_points:
        example: 10
        minimum: 0
        type: integer
      starts_at:
        type: string
      target_count:
        example: 10
        minimum: 1
        type: integer
      title:
        example: Ôn tập 10 từ hôm nay
        type: string
    type: object
  service.MissionResponse:
    properties:
      action_type:
        type: string
      created_at:
        type: string
      description:
        type: string
      ends_at:
        type: string
      id:
        format: uuid
        type: string
      is_active:
        type: boolean
      period:
        type: string
      reward_exp:
        type: integer
      reward_points:
        type: integer
      starts_at:
        type: string
      target_count:
        type: integer
      title:
        type: string
    type: object
  service.MyMissionResponse:
    properties:
      action_type:
        type: string
      completed:
        type: boolean
      description:
        type: string
      id:
        format: uuid
        type: string
      period:
        type: string
      progress_count:
        type: integer
      reward_exp:
        type: integer
      reward_points:
        type: integer
      target_count:
        type: integer
      title:
        type: string
    type: object
  service.NewVocabulary:
    properties:
      audio_url:
        type: string
      example:
        type: string
      language_id:
        example: en
        type: string
      level:
        example: A1
        type: string
      meaning:
        type: string
      phonetic:
        type: string
      term:
        example: apple
        type: string
      topic:
        example: Đồ ăn & Thức uống
        type: string
      vocabulary_id:
        format: uuid
        type: string
    type: object
  service.RegisterRequest:
    properties:
      email:
        example: user@laclingo.vn
        type: string
      full_name:
        example: Nguyễn Văn A
        maxLength: 100
        type: string
      password:
        example: matkhau123
        maxLength: 72
        minLength: 8
        type: string
      username:
        example: nguyenvana
        maxLength: 50
        minLength: 3
        type: string
    type: object
  service.SubmitExerciseResponse:
    properties:
      correct:
        type: boolean
    type: object
  service.UpdateProfileRequest:
    properties:
      avatar_url:
        example: https://example.com/avatar.png
        type: string
      full_name:
        example: Nguyễn Văn A
        maxLength: 100
        type: string
    type: object
  service.UserResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        example: user@laclingo.vn
        type: string
      exp:
        type: integer
      full_name:
        type: string
      id:
        format: uuid
        type: string
      level:
        type: integer
      points:
        type: integer
      role:
        example: user
        type: string
      streak_count:
        type: integer
      username:
        example: nguyenvana
        type: string
    type: object
  service.VocabularyCard:
    properties:
      audio_url:
        type: string
      example:
        type: string
      favorited:
        type: boolean
      image_emoji:
        description: từ không có emoji riêng thì lấy icon chủ đề
        example: "\U0001F34E"
        type: string
      image_url:
        type: string
      in_review:
        description: đã có trong hàng đợi ôn tập SRS
        type: boolean
      language_id:
        example: en
        type: string
      level:
        example: A1
        type: string
      like_count:
        type: integer
      liked:
        type: boolean
      meaning:
        type: string
      phonetic:
        type: string
      term:
        example: apple
        type: string
      topic:
        type: string
      vocabulary_id:
        format: uuid
        type: string
    type: object
  service.VocabularyTopic:
    properties:
      icon:
        example: "\U0001F35C"
        type: string
      learned:
        description: số từ đã vào hàng đợi SRS
        example: 12
        type: integer
      name:
        example: Đồ ăn & Thức uống
        type: string
      total:
        example: 25
        type: integer
    type: object
info:
  contact: {}
  description: API học ngôn ngữ với thuật toán SRS (SM-2).
  title: LacLingo API
  version: "1.0"
paths:
  /admin/missions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.MissionResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Danh sách toàn bộ nhiệm vụ (admin, kể cả đã tắt)
      tags:
      - admin-missions
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin nhiệm vụ
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.MissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.MissionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tạo nhiệm vụ mới (admin)
      tags:
      - admin-missions
  /admin/missions/{id}:
    delete:
      parameters:
      - description: Mission ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tắt nhiệm vụ (admin, xoá mềm — giữ lịch sử tiến độ)
      tags:
      - admin-missions
    put:
      consumes:
      - application/json
      parameters:
      - description: Mission ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin nhiệm vụ
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.MissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.MissionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Sửa nhiệm vụ (admin)
      tags:
      - admin-missions
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email hoặc username, và mật khẩu
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Đăng nhập
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Mật khẩu 8-72 ký tự. Trả về access token để đăng nhập luôn.
      parameters:
      - description: Thông tin đăng ký
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Đăng ký tài khoản
      tags:
      - auth
  /challenges/rooms:
    post:
      consumes:
      - application/json
      parameters:
      - description: Cấu hình phòng
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CreateRoomResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tạo phòng thử thách
      tags:
      - challenges
  /challenges/rooms/{id}:
    get:
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.RoomDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Thông tin phòng thử thách
      tags:
      - challenges
  /challenges/rooms/{id}/invite:
    post:
      consumes:
      - application/json
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: string
      - description: Username người được mời
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.InviteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ParticipantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mời người chơi vào phòng theo username (chỉ host)
      tags:
      - challenges
  /challenges/rooms/{id}/leaderboard:
    get:
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.LeaderboardEntryResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Bảng xếp hạng phòng thử thách
      tags:
      - challenges
  /challenges/rooms/join:
    post:
      consumes:
      - application/json
      parameters:
      - description: Mã phòng
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.JoinRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ParticipantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tham gia phòng bằng mã
      tags:
      - challenges
  /grammar/exercises/{id}/submit:
    post:
      consumes:
      - application/json
      description: Chạy song song với check client-side hiện có — chỉ để ghi nhận
        tiến độ nhiệm vụ.
      parameters:
      - description: Exercise ID (UUID)
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Câu trả lời
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.submitExerciseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.SubmitExerciseResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Chấm 1 bài tập ngữ pháp
      tags:
      - grammar
  /grammar/lessons/{code}:
    get:
      description: Nội dung bài học (summary, công thức, dấu hiệu) và danh sách bài
        tập.
      parameters:
      - description: Lesson code
        example: present_simple
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.GrammarLessonDetail'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Chi tiết bài học ngữ pháp
      tags:
      - grammar
  /languages:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.LanguageResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Danh sách ngôn ngữ
      tags:
      - languages
  /languages/{id}:
    get:
      parameters:
      - description: Language ID
        example: en
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.LanguageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Lấy thông tin ngôn ngữ
      tags:
      - languages
  /languages/{id}/grammar:
    get:
      description: Mỗi chủ đề kèm danh sách bài học (không gồm nội dung chi tiết).
      parameters:
      - description: Language ID
        example: en
        in: path
        name: id
        required: true
        type: string
