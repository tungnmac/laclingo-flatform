    <h1>Bạn đang offline</h1>
    <p>LacLingo cần kết nối mạng để tải bài học. Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại nhé.</p>
    <button type="button" onclick="retry()">Thử lại</button>
  </main>
  <script>
    window.LACLINGO_URL = "";
    // replace: thay trang lỗi trong lịch sử bằng web — nút Back không quay lại trang lỗi
    function retry() { if (window.LACLINGO_URL) location.replace(window.LACLINGO_URL) }
    window.addEventListener('online', retry)

    // Mở app lúc mất mạng: lần nạp đầu lỗi vì service worker của web (ôn tập offline — web/public/sw.js) còn đang
    // ngủ, chính lần nạp đó đánh thức nó → tự mở lại web 1 lần là hiện trang ôn tập / trang offline đã lưu.
    // Chặn lặp (chưa từng có service worker, vd cài app lúc không có mạng): lần tự mở trước chưa quá 15 giây → hiện trang này
    var KEY = 'laclingo-auto-retry'
    var last = 0
    try { last = Number(sessionStorage.getItem(KEY)) || 0 } catch (e) {}
    function show() {
      document.getElementById('content').hidden = false
      // Ẩn màn chờ khởi động để thấy trang này — plugin LaunchOverlay (android/.../LaunchOverlay.java)
      try { window.Capacitor.Plugins.LaunchOverlay.hide() } catch (e) {}
    }
    if (window.LACLINGO_URL && Date.now() - last > 15000) {
      try { sessionStorage.setItem(KEY, String(Date.now())) } catch (e) {}
      setTimeout(retry, 500)
      setTimeout(show, 3000) // mạng chập chờn: lần mở lại treo lâu thì vẫn hiện trang này, không để màn hình trắng
    } else {
      show()
    }
  </script>
