# Production LacLingo trên 1 máy chủ: Postgres + chạy migration + backend + web + Caddy (HTTPS tự động).
# Chạy: cd deploy && cp .env.example .env (điền) && docker compose -f docker-compose.prod.yml up -d --build
# Chi tiết: deploy/README.md

name: laclingo

# Giới hạn log mỗi container (mặc định json-file không xoay vòng → đầy đĩa)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laclingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong deploy/.env}
      POSTGRES_DB: laclingo
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laclingo -d laclingo"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  # Chạy migration mỗi lần deploy rồi thoát — backend chỉ khởi động khi migration thành công
  migrate:
    logging: *logging
    image: migrate/migrate:v4.18.1
    command: ["-path", "/migrations", "-database", "postgres://laclingo:${POSTGRES_PASSWORD}@postgres:5432/laclingo?sslmode=disable", "up"]
    volumes:
      - ../packages/database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  backend:
    logging: *logging
    # Context gốc repo: image chứa packages/database/migrations (backend cũng tự migrate lúc khởi động — sau container
    # migrate ở trên thì không còn gì để chạy)
    build:
      context: ..
      dockerfile: apps/laclingo/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET trong deploy/.env}
      DATABASE_URL: postgres://laclingo:${POSTGRES_PASSWORD}@postgres:5432/laclingo?sslmode=disable
      APP_ENV: production
      APP_WEB_URL: https://${WEB_DOMAIN}
      APP_API_URL: https://${API_DOMAIN}/api/v1
      # Chỉ tin X-Forwarded-For từ Caddy (IP cố định bên dưới) → giới hạn đăng nhập theo IP thật của người dùng.
      # KHÔNG tin cả dải 172.28.0.0/16: gateway 172.28.0.1 (docker-proxy, vd client IPv6) sẽ bị coi là proxy.
      TRUSTED_PROXIES: 172.28.0.10
    volumes:
      - ./secrets:/secrets:ro # file service account Firebase / Google Play (FCM_SERVICE_ACCOUNT_FILE=/secrets/...)
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  web:
    logging: *logging
    build:
      context: ../apps/laclingo/web
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api/v1
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:?Đặt CONTACT_EMAIL trong deploy/.env}
    restart: unless-stopped
    networks: [internal]

  caddy:
    logging: *logging
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Đặt WEB_DOMAIN trong deploy/.env}
      API_DOMAIN: ${API_DOMAIN:?Đặt API_DOMAIN trong deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Đặt ACME_EMAIL trong deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, web]
    networks:
      internal:
        ipv4_address: 172.28.0.10 # = TRUSTED_PROXIES của backend

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
